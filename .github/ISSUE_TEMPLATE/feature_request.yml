name: Feature or evaluation idea
description: Propose a focused improvement or synthetic review example.
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior and how to evaluate it
    validations:
      required: true
  - type: markdown
    attributes:
      value: Please use synthetic examples and avoid private conversation content.
