name: Source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/check.mjs
      - run: node test/run.mjs
# Host-backed tests need an installed matching Harness SDK and are run locally.
